name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stage-2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental_dev
          POSTGRES_DB: rental_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      RENTAL_POSTGRES_HOST: localhost
      RENTAL_POSTGRES_PORT: 5432
      RENTAL_POSTGRES_USER: rental
      RENTAL_POSTGRES_PASSWORD: rental_dev
      RENTAL_POSTGRES_DATABASE: rental_analytics
      RENTAL_TEST_POSTGRES_DSN: postgresql://rental:rental_dev@localhost:5432/rental_analytics
      RENTAL_SOURCE_PATH: data/source
      RENTAL_BRONZE_PATH: data/bronze
      RENTAL_QUALITY_PATH: data/quality
      RENTAL_REJECTED_PATH: data/rejected
      RENTAL_SILVER_PATH: data/silver
      RENTAL_DBT_PROJECT_PATH: warehouse/dbt
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      SPARK_LOCAL_IP: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev,warehouse,orchestration]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Compile and build package
        run: |
          python -m compileall -q src
          python -m build

      - name: Validate Docker Compose
        run: docker compose --profile pipeline --profile airflow config --quiet

      - name: Initialize PostgreSQL
        run: |
          for migration in warehouse/migrations/*.sql; do
            PGPASSWORD="$RENTAL_POSTGRES_PASSWORD" psql \
              --host "$RENTAL_POSTGRES_HOST" \
              --username "$RENTAL_POSTGRES_USER" \
              --dbname "$RENTAL_POSTGRES_DATABASE" \
              --file "$migration"
          done

      - name: Run the Stage 2 pipeline
        run: rental-platform run --batch-id ci-full-load

      - name: Build and test the dbt warehouse
        run: dbt build --project-dir warehouse/dbt --profiles-dir warehouse/dbt

      - name: Run tests
        run: pytest
