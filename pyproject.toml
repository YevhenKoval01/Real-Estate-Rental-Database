[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rental-analytics-platform"
version = "0.2.0"
description = "A reproducible rental analytics and data engineering platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Yevhen Koval" }]
dependencies = [
    "psycopg[binary]>=3.2.13,<4",
    "pydantic-settings>=2.12,<3",
    "pyspark==3.5.9",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff==0.16.4",
]
warehouse = [
    "dbt-core==1.11.14",
    "dbt-postgres==1.11.0",
]
orchestration = [
    "apache-airflow==2.11.2",
]

[project.scripts]
rental-platform = "rental_platform.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/rental_platform"]

[tool.pytest.ini_options]
addopts = "--strict-markers -ra"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL service",
    "airflow: requires the optional Airflow dependency",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
